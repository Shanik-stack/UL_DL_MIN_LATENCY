[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latency-optimization"
version = "1.0.0"
description = "Finite-blocklength uplink and downlink latency experiments"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "PyYAML",
    "scipy",
    "torch",
]

[project.scripts]
latency-experiments = "latency_optimization.__main__:main"

[tool.setuptools.packages.find]
include = ["latency_optimization*"]
