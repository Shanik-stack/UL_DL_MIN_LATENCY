test:
  K: 2
  Nr: [3, 3]
  Nt: [1, 1]
  T: [2, 2]
  B: [1, 1]
  P: [10, 10]
  snr_db: [20, 20]
  fs: [15000.0, 15000.0]
  epsilon: [1.0e-1, 1.0e-1]

simulation:
  finite_blocklength_rate_law: normal_approximation
  convergence_precoder_update_mode: direct_precoder
  max_epochs: 2
  lr_net: 0.02
  print_every_epoch: 1
  precoder_change_tolerance: 1.0e-3
  convergence_stopping_rule: objective_stationarity
  kkt_primal_tolerance: 1.0e-3
  kkt_complementarity_tolerance: 1.0e-6
  kkt_stationarity_tolerance: 1.0e-3
  max_total_blocks: 1
  uplink_rate_model: snr
  experiment_scenario:
    mode: payload
    payload_bits_source: system_B
  n_kl_range:
    min: 1
    step: 1
  n_search_direction: descending
  n_search_strategy: fixed_step
  n_search_coarse_step: 1
  n_search_exponential_factor: 2
  exhaustive_compare:
    max_blocks: 1
    allow_block_skip: false
    suppress_inner_logs: true
    catalog_detail_mode: full
