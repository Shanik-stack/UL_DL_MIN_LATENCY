test:
  K: 3
  Nb: [16, 16, 16]
  Nr: [4, 4, 4]
  T: [12, 14, 16]
  B: [80, 120, 160]
  P: [30, 30, 30]
  snr_db: [4, 4, 4]
  fs: [15000.0, 15000.0, 15000.0]
  epsilon: [1.0e-14, 1.0e-14, 1.0e-14]
  initial_bits_per_symbol: [4, 4, 4]

simulation:
  finite_blocklength_rate_law: normal_approximation
  # Training-only convergence: direct_precoder or precoder_net.
  convergence_precoder_update_mode: precoder_net
  # A precoder network can be one model per user or one model for the BS.
  downlink_precoder_net_scope: per_user_nets
  # Used only by streaming with bs_shared_net.
  shared_bs_streaming_blocklength_input_mode: joint_blocklength_vector
  max_epochs: 120
  user_update_lr: 0.001
  print_every_epoch: 5
  precoder_change_tolerance: 1.0e-3
  convergence_stopping_rule: objective_stationarity
  kkt_primal_tolerance: 1.0e-3
  kkt_complementarity_tolerance: 1.0e-6
  kkt_stationarity_tolerance: 1.0e-3

  # Payload Monte Carlo: this is a channel count. Each seed contributes one
  # channel episode; later blocks are generated by that episode's rollout.
  monte_carlo_num_training_channels: 11
  monte_carlo_training_snr_db_ranges:
    - [-4.0, 2.0]
    - [-4.0, 2.0]
    - [-4.0, 2.0]
  monte_carlo_num_test_channels: 11
  monte_carlo_test_snr_db_ranges:
    - [-4.0, 2.0]
    - [-4.0, 2.0]
    - [-4.0, 2.0]
  monte_carlo_training_max_epochs: 120

  max_total_blocks: 256
  experiment_scenario:
    mode: payload
    payload_bits_source: system_B

  n_kl_range:
    min: 1
    step: 1
  n_search_direction: descending
  n_search_strategy: fixed_step
  n_search_coarse_step: 2
  n_search_exponential_factor: 2
